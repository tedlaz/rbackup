# Push a tag like v0.1.0 -> build rbackup.exe on Windows and attach it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Same asset name every release: rbackup.zip containing rbackup.exe,
      # so https://github.com/<owner>/<repo>/releases/latest/download/rbackup.zip always works.
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/rbackup.exe -DestinationPath rbackup.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" rbackup.zip --title "rbackup ${{ github.ref_name }}" --generate-notes
