[package]
name = "rbackup"
version = "0.2.0"
edition = "2024"

[dependencies]
# Software renderer only: no OpenGL / wgpu.
slint = { version = "1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "unstable-winit-030",
] }
rfd = "0.15"

# Same version/features winit already builds: bring the running instance to the front.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
